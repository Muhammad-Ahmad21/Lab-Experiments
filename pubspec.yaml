name: mendly_1
description: A wellness and mindfulness app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: SF Pro Text
      fonts:
        - asset: assets/fonts/SFPRODISPLAYREGULAR.otf
          weight: 400
        - asset: assets/fonts/SFPRODISPLAYMEDIUM.otf
          weight: 500
        - asset: assets/fonts/SFPRODISPLAYSEMIBOLDITALIC.otf
          weight: 600
        - asset: assets/fonts/SFPRODISPLAYBOLD.otf
          weight: 700

  assets:
    - assets/images/logo.jpg